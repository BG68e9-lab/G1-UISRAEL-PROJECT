# Test-specific configuration
spring.application.name=cwdrinkhouse-test

# Disable scheduling for unit tests
spring.task.scheduling.enabled=false
spring.scheduling.enabled=false

# Disable health checks for testing
app.health-check.enabled=false

# Database configuration for tests
spring.datasource.url=jdbc:h2:mem:test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop

# Disable logging during tests
logging.level.root=WARN
logging.level.com.uisrael.cwdrinkhouse=WARN
logging.level.org.springframework=WARN
