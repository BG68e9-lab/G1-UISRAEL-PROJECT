spring.application.name=cwdrinkhouse

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=0
server.servlet.context-path=/

# ============================================
# DATABASE CONFIGURATION (H2)
# ============================================
spring.datasource.url=jdbc:h2:mem:drinkhouse_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================
# SESSION CONFIGURATION  
# ============================================
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.max-age=3600
server.servlet.session.tracking-modes=cookie
spring.session.store-type=none

# Prevent session fixation
server.servlet.session.cookie.path=/

# ============================================
# SECURITY CONFIGURATION
# ============================================
spring.security.filter.order=5

# ============================================
# THYMELEAF CONFIGURATION
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
# Force template refresh
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ============================================
# JACKSON CONFIGURATION
# ============================================
spring.jackson.time-zone=UTC

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.com.uisrael.cwdrinkhouse=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# ============================================
# BACKEND API CONFIGURATION
# ============================================
app.backend.url=http://localhost:8080
app.backend.api.base-path=/api/v1

# Mock Backend Configuration (set to true when backend is not available)
app.backend.mock.enabled=false

# WebClient Configuration - Timeout Settings (in seconds)
app.webclient.timeout.connect=30s
app.webclient.timeout.read=2m
app.webclient.timeout.write=30s

# WebClient Retry Configuration - Exponential Backoff
app.webclient.retry.max-attempts=3
app.webclient.retry.backoff-delay=2s

# Connection Pool Configuration
app.webclient.pool.max-connections=50
app.webclient.pool.max-idle-time=30s
app.webclient.pool.max-life-time=300s
app.webclient.pool.pending-acquire-timeout=60s

# Keep-alive Configuration
app.webclient.keep-alive.enabled=true
app.webclient.keep-alive.timeout=60s

# ============================================
# CACHE CONFIGURATION
# ============================================
app.config.cache-enabled=true
app.config.cache-ttl-categories=3600
app.config.cache-ttl-roles=3600
app.config.cache-ttl-products=1800
app.config.cache-ttl-providers=1800
app.config.cache-max-size=1000
app.config.backend-url=http://localhost:8080
app.config.session-timeout-minutes=30
app.cache.ttl.categories=3600000
app.cache.ttl.roles=3600000
