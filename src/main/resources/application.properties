spring.application.name=drinkhouse
spring.profiles.active=${SPRING_PROFILE:dev}

# Desactivar ejecución automática de data.sql
spring.sql.init.mode=never

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=V
spring.flyway.sql-migration-separator=__
spring.flyway.sql-migration-suffixes=.sql

# Configuración por defecto del cliente Claude (Anthropic)
# Usando Haiku 4.5: 3x más barato y más rápido que Sonnet
anthropic.api.key=${ANTHROPIC_API_KEY:sk-ant-placeholder}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=claude-haiku-4-5-20251001
# maxTokens ajustado para respuestas JSON (200 tokens suficiente para producto/botella/factura)
anthropic.max-tokens=200
# Prompt caching: reduce ~90% del costo del system prompt en llamadas repetidas
anthropic.enable-prompt-caching=true

# SpringDoc OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:bryanguerrerospp@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
