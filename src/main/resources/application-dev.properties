spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/drinkhouse_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}

# Ejecutar data.sql al arrancar (inserts con ON CONFLICT DO NOTHING = idempotente)
spring.sql.init.mode=always

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración del cliente Claude (Anthropic) - opcional
anthropic.api.key=${ANTHROPIC_API_KEY:sk-ant-placeholder}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=claude-3-5-sonnet-20241022
anthropic.max-tokens=300

# Logging para debugging
logging.level.com.uisrael.drinkhouse=DEBUG
logging.level.org.springframework.web=DEBUG