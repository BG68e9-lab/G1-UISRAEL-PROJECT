<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Enhanced Form Field Fragment -->
    <div th:fragment="form-field" 
         th:with="fieldType=${fieldType ?: 'text'},
                  fieldName=${fieldName ?: 'field'},
                  fieldLabel=${fieldLabel ?: 'Campo'},
                  fieldValue=${fieldValue ?: ''},
                  fieldPlaceholder=${fieldPlaceholder ?: ''},
                  fieldRequired=${fieldRequired ?: false},
                  fieldReadonly=${fieldReadonly ?: false},
                  fieldDisabled=${fieldDisabled ?: false},
                  fieldPattern=${fieldPattern},
                  fieldMin=${fieldMin},
                  fieldMax=${fieldMax},
                  fieldStep=${fieldStep},
                  fieldOptions=${fieldOptions},
                  fieldHelp=${fieldHelp},
                  fieldIcon=${fieldIcon},
                  fieldSize=${fieldSize},
                  showValidation=${showValidation ?: true}">
        
        <div class="mb-3">
            <label th:for="${fieldName}" class="form-label">
                <span th:text="${fieldLabel}">Label</span>
                <span th:if="${fieldRequired}" class="text-danger">*</span>
                <span th:if="${fieldHelp != null}" class="text-muted ms-1">
                    <i class="bi bi-question-circle" 
                       data-bs-toggle="tooltip" 
                       data-bs-placement="top" 
                       th:title="${fieldHelp}"></i>
                </span>
            </label>
            
            <!-- Input Group for fields with icons -->
            <div th:if="${fieldIcon != null}" class="input-group">
                <span class="input-group-text">
                    <i th:class="'bi ' + ${fieldIcon}"></i>
                </span>
                
                <!-- Text, Email, Password, Number inputs with icon -->
                <input th:if="${fieldType == 'text' or fieldType == 'email' or fieldType == 'password' or fieldType == 'number' or fieldType == 'tel' or fieldType == 'url'}"
                       th:type="${fieldType}"
                       th:id="${fieldName}"
                       th:name="${fieldName}"
                       th:value="${fieldValue}"
                       th:placeholder="${fieldPlaceholder}"
                       th:required="${fieldRequired}"
                       th:readonly="${fieldReadonly}"
                       th:disabled="${fieldDisabled}"
                       th:pattern="${fieldPattern}"
                       th:min="${fieldMin}"
                       th:max="${fieldMax}"
                       th:step="${fieldStep}"
                       th:class="'form-control' + (${fieldSize} ? ' form-control-' + ${fieldSize} : '') + (${showValidation and #fields.hasErrors(fieldName)} ? ' is-invalid' : '')"
                       th:aria-describedby="${fieldName + '_help'}"
                       data-field-validation="true">
            </div>
            
            <!-- Regular inputs without icons -->
            <div th:if="${fieldIcon == null}">
                <!-- Text, Email, Password, Number inputs -->
                <input th:if="${fieldType == 'text' or fieldType == 'email' or fieldType == 'password' or fieldType == 'number' or fieldType == 'tel' or fieldType == 'url'}"
                       th:type="${fieldType}"
                       th:id="${fieldName}"
                       th:name="${fieldName}"
                       th:value="${fieldValue}"
                       th:placeholder="${fieldPlaceholder}"
                       th:required="${fieldRequired}"
                       th:readonly="${fieldReadonly}"
                       th:disabled="${fieldDisabled}"
                       th:pattern="${fieldPattern}"
                       th:min="${fieldMin}"
                       th:max="${fieldMax}"
                       th:step="${fieldStep}"
                       th:class="'form-control' + (${fieldSize} ? ' form-control-' + ${fieldSize} : '') + (${showValidation and #fields.hasErrors(fieldName)} ? ' is-invalid' : '')"
                       th:aria-describedby="${fieldName + '_help'}"
                       data-field-validation="true">
                
                <!-- Date input -->
                <input th:if="${fieldType == 'date' or fieldType == 'datetime-local' or fieldType == 'time'}"
                       th:type="${fieldType}"
                       th:id="${fieldName}"
                       th:name="${fieldName}"
                       th:value="${fieldValue}"
                       th:required="${fieldRequired}"
                       th:readonly="${fieldReadonly}"
                       th:disabled="${fieldDisabled}"
                       th:min="${fieldMin}"
                       th:max="${fieldMax}"
                       th:class="'form-control' + (${fieldSize} ? ' form-control-' + ${fieldSize} : '') + (${showValidation and #fields.hasErrors(fieldName)} ? ' is-invalid' : '')"
                       th:aria-describedby="${fieldName + '_help'}"
                       data-field-validation="true">
                
                <!-- Textarea -->
                <textarea th:if="${fieldType == 'textarea'}"
                          th:id="${fieldName}"
                          th:name="${fieldName}"
                          th:placeholder="${fieldPlaceholder}"
                          th:required="${fieldRequired}"
                          th:readonly="${fieldReadonly}"
                          th:disabled="${fieldDisabled}"
                          th:class="'form-control' + (${fieldSize} ? ' form-control-' + ${fieldSize} : '') + (${showValidation and #fields.hasErrors(fieldName)} ? ' is-invalid' : '')"
                          th:aria-describedby="${fieldName + '_help'}"
                          rows="3"
                          data-field-validation="true"
                          th:text="${fieldValue}"></textarea>
                
                <!-- Select dropdown -->
                <select th:if="${fieldType == 'select'}"
                        th:id="${fieldName}"
                        th:name="${fieldName}"
                        th:required="${fieldRequired}"
                        th:disabled="${fieldReadonly or fieldDisabled}"
                        th:class="'form-select' + (${fieldSize} ? ' form-select-' + ${fieldSize} : '') + (${showValidation and #fields.hasErrors(fieldName)} ? ' is-invalid' : '')"
                        th:aria-describedby="${fieldName + '_help'}"
                        data-field-validation="true">
                    <option value="" th:text="${fieldPlaceholder ?: 'Seleccione una opción'}">Choose option</option>
                    <option th:each="option : ${fieldOptions}"
                            th:value="${option.value}"
                            th:text="${option.label}"
                            th:selected="${fieldValue != null and fieldValue.toString() == option.value.toString()}">
                        Option
                    </option>
                </select>
                
                <!-- File input -->
                <input th:if="${fieldType == 'file'}"
                       type="file"
                       th:id="${fieldName}"
                       th:name="${fieldName}"
                       th:required="${fieldRequired}"
                       th:disabled="${fieldReadonly or fieldDisabled}"
                       th:accept="${fieldPattern}"
                       th:class="'form-control' + (${fieldSize} ? ' form-control-' + ${fieldSize} : '') + (${showValidation and #fields.hasErrors(fieldName)} ? ' is-invalid' : '')"
                       th:aria-describedby="${fieldName + '_help'}"
                       data-field-validation="true">
            </div>
            
            <!-- Checkbox -->
            <div th:if="${fieldType == 'checkbox'}" class="form-check">
                <input type="checkbox"
                       th:id="${fieldName}"
                       th:name="${fieldName}"
                       th:checked="${fieldValue == true or fieldValue == 'true' or fieldValue == 'on'}"
                       th:disabled="${fieldReadonly or fieldDisabled}"
                       th:class="'form-check-input' + (${showValidation and #fields.hasErrors(fieldName)} ? ' is-invalid' : '')"
                       th:aria-describedby="${fieldName + '_help'}"
                       data-field-validation="true">
                <label class="form-check-label" th:for="${fieldName}" th:text="${fieldLabel}">Checkbox Label</label>
            </div>
            
            <!-- Radio buttons -->
            <div th:if="${fieldType == 'radio'}" class="form-check-container">
                <div th:each="option : ${fieldOptions}" class="form-check">
                    <input type="radio"
                           th:id="${fieldName + '_' + option.value}"
                           th:name="${fieldName}"
                           th:value="${option.value}"
                           th:checked="${fieldValue != null and fieldValue.toString() == option.value.toString()}"
                           th:disabled="${fieldReadonly or fieldDisabled}"
                           th:class="'form-check-input' + (${showValidation and #fields.hasErrors(fieldName)} ? ' is-invalid' : '')"
                           th:aria-describedby="${fieldName + '_help'}"
                           data-field-validation="true">
                    <label class="form-check-label" 
                           th:for="${fieldName + '_' + option.value}" 
                           th:text="${option.label}">
                        Radio Label
                    </label>
                </div>
            </div>
            
            <!-- Range input -->
            <input th:if="${fieldType == 'range'}"
                   type="range"
                   th:id="${fieldName}"
                   th:name="${fieldName}"
                   th:value="${fieldValue}"
                   th:disabled="${fieldReadonly or fieldDisabled}"
                   th:min="${fieldMin ?: 0}"
                   th:max="${fieldMax ?: 100}"
                   th:step="${fieldStep ?: 1}"
                   class="form-range"
                   th:aria-describedby="${fieldName + '_help'}"
                   oninput="updateRangeValue(this)"
                   data-field-validation="true">
            
            <!-- Hidden input -->
            <input th:if="${fieldType == 'hidden'}"
                   type="hidden"
                   th:id="${fieldName}"
                   th:name="${fieldName}"
                   th:value="${fieldValue}">
            
            <!-- Field validation errors -->
            <div th:if="${showValidation and #fields.hasErrors(fieldName)}" class="invalid-feedback">
                <ul class="mb-0 list-unstyled">
                    <li th:each="error : ${#fields.errors(fieldName)}" th:text="${error}">Error message</li>
                </ul>
            </div>
            
            <!-- Valid feedback -->
            <div th:if="${showValidation}" class="valid-feedback">
                Campo válido
            </div>
            
            <!-- Field help text -->
            <div th:if="${fieldHelp != null and fieldType != 'checkbox' and fieldType != 'radio'}" 
                 th:id="${fieldName + '_help'}" 
                 class="form-text" 
                 th:text="${fieldHelp}">Help text</div>
        </div>
    </div>
    
    <!-- Form Group with Multiple Fields -->
    <div th:fragment="form-group" 
         th:with="groupTitle=${groupTitle},
                  groupDescription=${groupDescription},
                  groupClass=${groupClass ?: 'row'}">
        <fieldset th:if="${groupTitle != null}" class="mb-4">
            <legend class="h5 mb-3" th:text="${groupTitle}">Group Title</legend>
            <p th:if="${groupDescription != null}" 
               class="text-muted mb-3" 
               th:text="${groupDescription}">Group description</p>
            <div th:class="${groupClass}">
                <!-- Fields will be included by the calling template -->
            </div>
        </fieldset>
        <div th:if="${groupTitle == null}" th:class="${groupClass}">
            <!-- Fields will be included by the calling template -->
        </div>
    </div>
    
    <!-- Form Buttons -->
    <div th:fragment="form-buttons" 
         th:with="submitText=${submitText ?: 'Guardar'},
                  cancelUrl=${cancelUrl},
                  cancelText=${cancelText ?: 'Cancelar'},
                  showReset=${showReset ?: false},
                  resetText=${resetText ?: 'Limpiar'},
                  additionalButtons=${additionalButtons}">
        <div class="d-flex gap-2 justify-content-end">
            <!-- Additional custom buttons -->
            <button th:each="btn : ${additionalButtons ?: {}}"
                    type="button"
                    th:class="'btn btn-' + (${btn.style} ?: 'outline-secondary')"
                    th:onclick="${btn.onclick}"
                    th:text="${btn.text}">
                Custom Button
            </button>
            
            <!-- Reset button -->
            <button th:if="${showReset}" 
                    type="reset" 
                    class="btn btn-outline-secondary"
                    th:text="${resetText}">
                Reset
            </button>
            
            <!-- Cancel button -->
            <a th:if="${cancelUrl != null}" 
               th:href="@{${cancelUrl}}" 
               class="btn btn-outline-secondary"
               th:text="${cancelText}">
                Cancel
            </a>
            
            <!-- Submit button -->
            <button type="submit" 
                    class="btn btn-primary"
                    th:text="${submitText}">
                Submit
            </button>
        </div>
    </div>
    
    <!-- Form Validation Summary -->
    <div th:fragment="validation-summary" th:if="${#fields.hasAnyErrors()}">
        <div class="alert alert-danger" role="alert">
            <h6 class="alert-heading">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                Por favor corrija los siguientes errores:
            </h6>
            <ul class="mb-0">
                <li th:each="error : ${#fields.allErrors()}" th:text="${error}">Error message</li>
            </ul>
        </div>
    </div>
    
    <!-- Dynamic Field Addition -->
    <div th:fragment="dynamic-field-container" 
         th:with="containerId=${containerId ?: 'dynamicFields'},
                  fieldTemplate=${fieldTemplate ?: 'defaultTemplate'},
                  maxFields=${maxFields ?: 10},
                  minFields=${minFields ?: 0}">
        <div th:id="${containerId}" class="dynamic-fields-container">
            <!-- Dynamic fields will be added here -->
        </div>
        <div class="mt-2">
            <button type="button" 
                    class="btn btn-outline-primary btn-sm"
                    th:onclick="'addDynamicField(\'' + ${containerId} + '\', \'' + ${fieldTemplate} + '\', ' + ${maxFields} + ')'">
                <i class="bi bi-plus-circle me-1"></i>
                Agregar Campo
            </button>
        </div>
    </div>
    
    <!-- Form JavaScript -->
    <script th:fragment="form-scripts">
        // Form validation
        (function() {
            'use strict';
            // Bootstrap form validation
            const forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();
        
        // Disable form submission on double click
        document.addEventListener('DOMContentLoaded', function() {
            const forms = document.querySelectorAll('form');
            forms.forEach(form => {
                form.addEventListener('submit', function() {
                    const submitButton = form.querySelector('button[type="submit"]');
                    if (submitButton) {
                        submitButton.disabled = true;
                        submitButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Enviando...';
                    }
                });
            });
        });
        
        // Dynamic field management
        let fieldCounter = 0;
        
        function addDynamicField(containerId, templateName, maxFields) {
            const container = document.getElementById(containerId);
            const existingFields = container.children.length;
            
            if (existingFields >= maxFields) {
                alert('Máximo ' + maxFields + ' campos permitidos');
                return;
            }
            
            fieldCounter++;
            const fieldHtml = getDynamicFieldTemplate(templateName, fieldCounter);
            container.insertAdjacentHTML('beforeend', fieldHtml);
        }
        
        function removeDynamicField(button, minFields = 0) {
            const container = button.closest('.dynamic-fields-container');
            const existingFields = container.children.length;
            
            if (existingFields <= minFields) {
                alert('Mínimo ' + minFields + ' campo(s) requerido(s)');
                return;
            }
            
            button.closest('.dynamic-field').remove();
        }
        
        function getDynamicFieldTemplate(templateName, index) {
            // This would be customized based on the specific field template needed
            return `
                <div class="dynamic-field mb-3 p-3 border border-secondary rounded">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="mb-0">Campo ${index}</h6>
                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeDynamicField(this)">
                            <i class="bi bi-x-circle"></i>
                        </button>
                    </div>
                    <input type="text" name="dynamicField_${index}" class="form-control" placeholder="Valor del campo ${index}">
                </div>
            `;
        }
        
        // Auto-resize textareas
        document.addEventListener('DOMContentLoaded', function() {
            const textareas = document.querySelectorAll('textarea[data-auto-resize]');
            textareas.forEach(textarea => {
                textarea.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = (this.scrollHeight) + 'px';
                });
            });
        });
        
        // Real-time validation feedback
        function setupRealTimeValidation() {
            const inputs = document.querySelectorAll('input[data-field-validation], select[data-field-validation], textarea[data-field-validation]');
            inputs.forEach(input => {
                input.addEventListener('blur', function() {
                    validateField(this);
                });
                
                input.addEventListener('input', function() {
                    // Clear validation state on input
                    this.classList.remove('is-valid', 'is-invalid');
                });
            });
        }
        
        // Validate individual field
        function validateField(field) {
            let isValid = field.checkValidity();
            
            // Additional custom validations
            if (field.type === 'email' && field.value) {
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                isValid = isValid && emailPattern.test(field.value);
            }
            
            if (field.dataset.customValidation) {
                // Custom validation function
                const validationFn = window[field.dataset.customValidation];
                if (typeof validationFn === 'function') {
                    isValid = isValid && validationFn(field.value, field);
                }
            }
            
            if (isValid) {
                field.classList.remove('is-invalid');
                field.classList.add('is-valid');
            } else {
                field.classList.remove('is-valid');
                field.classList.add('is-invalid');
            }
            
            return isValid;
        }
        
        // Range input value display
        function updateRangeValue(rangeInput) {
            let valueDisplay = document.querySelector(`#${rangeInput.id}_value`);
            if (!valueDisplay) {
                valueDisplay = document.createElement('span');
                valueDisplay.id = `${rangeInput.id}_value`;
                valueDisplay.className = 'form-text';
                rangeInput.parentNode.appendChild(valueDisplay);
            }
            valueDisplay.textContent = `Valor: ${rangeInput.value}`;
        }
        
        // Tooltip initialization
        function initializeTooltips() {
            const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
            tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl);
            });
        }
        
        // Form validation enhancement
        function enhanceFormValidation() {
            const forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    let isFormValid = form.checkValidity();
                    
                    // Run custom validations
                    const fieldsWithCustomValidation = form.querySelectorAll('[data-custom-validation]');
                    fieldsWithCustomValidation.forEach(field => {
                        const fieldValid = validateField(field);
                        isFormValid = isFormValid && fieldValid;
                    });
                    
                    if (!isFormValid) {
                        event.preventDefault();
                        event.stopPropagation();
                        
                        // Focus first invalid field
                        const firstInvalid = form.querySelector('.is-invalid, :invalid');
                        if (firstInvalid) {
                            firstInvalid.focus();
                        }
                        
                        // Show error notification
                        if (typeof showError === 'function') {
                            showError('Por favor corrija los errores en el formulario antes de continuar.');
                        }
                    }
                    
                    form.classList.add('was-validated');
                }, false);
            });
        }
        
        // File input preview
        function setupFilePreview() {
            const fileInputs = document.querySelectorAll('input[type="file"][data-preview]');
            fileInputs.forEach(input => {
                input.addEventListener('change', function() {
                    const previewContainer = document.getElementById(this.dataset.preview);
                    if (previewContainer && this.files && this.files[0]) {
                        const file = this.files[0];
                        if (file.type.startsWith('image/')) {
                            const reader = new FileReader();
                            reader.onload = function(e) {
                                previewContainer.innerHTML = `<img src="${e.target.result}" class="img-thumbnail" style="max-height: 200px;">`;
                            };
                            reader.readAsDataURL(file);
                        } else {
                            previewContainer.innerHTML = `<div class="alert alert-info">Archivo seleccionado: ${file.name}</div>`;
                        }
                    }
                });
            });
        }
        
        // Call setup functions
        document.addEventListener('DOMContentLoaded', function() {
            setupRealTimeValidation();
            initializeTooltips();
            enhanceFormValidation();
            setupFilePreview();
        });
    </script>
</body>
</html>
