<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Header Fragment -->
    <div th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
            <div class="container-fluid">
                <!-- Brand/Logo with enhanced styling -->
                <a class="navbar-brand d-flex align-items-center" href="/dashboard">
                    <!-- Logo icon with gradient background -->
                    <div class="logo-container me-3">
                        <div class="logo-background">
                            <i class="bi bi-shop logo-icon"></i>
                        </div>
                    </div>
                    <!-- Business name with subtitle -->
                    <div class="brand-text">
                        <div class="brand-name" th:text="${businessName ?: 'Drinkhouse'}">Drinkhouse</div>
                        <div class="brand-subtitle">Sistema de Gestión</div>
                    </div>
                </a>
                
                <!-- Mobile Menu Toggle (only shown when authenticated) -->
                <button th:if="${session.userId != null}" 
                        class="navbar-toggler d-lg-none border-0" 
                        type="button" 
                        data-bs-toggle="offcanvas" 
                        data-bs-target="#sidebarMenu"
                        aria-controls="sidebarMenu" 
                        aria-expanded="false" 
                        aria-label="Abrir menú de navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <!-- User info and logout (only shown when authenticated) -->
                <div th:if="${session.userId != null}" class="navbar-nav ms-auto">
                    <!-- Alert notification badge -->
                    <li class="nav-item me-3">
                        <a class="nav-link position-relative p-2" 
                           href="/alertas" 
                           title="Ver alertas">
                            <i class="bi bi-bell fs-5"></i>
                            <span th:if="${alertCount != null and alertCount > 0}" 
                                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                <span th:text="${alertCount > 99 ? '99+' : alertCount}">0</span>
                                <span class="visually-hidden">alertas no leídas</span>
                            </span>
                        </a>
                    </li>
                    
                    <!-- User dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center user-dropdown" 
                           href="#" 
                           role="button" 
                           data-bs-toggle="dropdown" 
                           aria-expanded="false"
                           aria-label="Menú de usuario">
                            <!-- User avatar -->
                            <div class="user-avatar me-2">
                                <i class="bi bi-person-circle"></i>
                            </div>
                            <div class="user-info d-none d-md-block">
                                <div class="user-name" th:text="${session.userName != null ? session.userName : (session.userEmail != null ? #strings.substringBefore(session.userEmail, '@') : 'Usuario')}">Usuario</div>
                                <div class="user-role" th:text="${session.userRoles != null and #sets.contains(session.userRoles, 'ADMIN') ? 'Administrador' : 'Empleado'}">Empleado</div>
                            </div>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end user-dropdown-menu">
                            <!-- User info header -->
                            <li class="dropdown-header">
                                <div class="d-flex align-items-center">
                                    <div class="user-avatar-large me-3">
                                        <i class="bi bi-person-circle"></i>
                                    </div>
                                    <div>
                                        <div class="fw-semibold" th:text="${session.userName != null ? session.userName : (session.userEmail != null ? #strings.substringBefore(session.userEmail, '@') : 'Usuario')}">Usuario</div>
                                        <small class="text-muted" th:text="${session.userEmail ?: 'usuario@email.com'}">usuario@email.com</small>
                                    </div>
                                </div>
                            </li>
                            
                            <li><hr class="dropdown-divider"></li>
                            
                            <!-- Roles display -->
                            <li class="dropdown-item-text">
                                <small class="text-muted d-block mb-1">Roles:</small>
                                <div th:if="${session.userRoles != null}" th:each="role : ${session.userRoles}" class="d-inline-block">
                                    <span class="badge me-1" 
                                          th:classappend="${role == 'ADMIN' ? 'bg-primary' : 'bg-secondary'}" 
                                          th:text="${role}">ADMIN</span>
                                </div>
                            </li>
                            
                            <!-- Session info -->
                            <li class="dropdown-item-text">
                                <small class="text-muted d-block mb-1">Sesión iniciada:</small>
                                <small th:if="${session.loginTime != null}" th:text="${#temporals.format(session.loginTime, 'dd/MM/yyyy HH:mm')}">01/01/2024 10:00</small>
                                <small th:if="${session.loginTime == null}">01/01/2024 10:00</small>
                            </li>
                            
                            <li><hr class="dropdown-divider"></li>
                            
                            <!-- Logout -->
                            <li>
                                <form method="post" action="/logout" class="d-inline w-100">
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="bi bi-box-arrow-right me-2"></i>
                                        Cerrar Sesión
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </div>
            </div>
        </nav>
        
        <!-- Additional header styles -->
        <style>
            .logo-container {
                position: relative;
            }
            
            .logo-background {
                width: 40px;
                height: 40px;
                background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.1) 100%);
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.2);
            }
            
            .logo-icon {
                font-size: 1.5rem;
                color: white;
            }
            
            .brand-text {
                line-height: 1.2;
            }
            
            .brand-name {
                font-size: 1.25rem;
                font-weight: 700;
                color: white;
                letter-spacing: -0.5px;
            }
            
            .brand-subtitle {
                font-size: 0.75rem;
                color: rgba(255,255,255,0.8);
                font-weight: 400;
            }
            
            .user-dropdown {
                padding: 8px 12px;
                border-radius: 25px;
                transition: all 0.3s ease;
                border: 1px solid rgba(255,255,255,0.1);
            }
            
            .user-dropdown:hover {
                background-color: rgba(255,255,255,0.1);
                border-color: rgba(255,255,255,0.2);
            }
            
            .user-avatar {
                font-size: 1.5rem;
                color: rgba(255,255,255,0.9);
            }
            
            .user-avatar-large {
                font-size: 2.5rem;
                color: var(--bs-primary);
            }
            
            .user-info {
                text-align: left;
            }
            
            .user-name {
                font-size: 0.875rem;
                font-weight: 600;
                color: white;
                line-height: 1.2;
            }
            
            .user-role {
                font-size: 0.75rem;
                color: rgba(255,255,255,0.7);
                line-height: 1.2;
            }
            
            .user-dropdown-menu {
                border: none;
                border-radius: 15px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                min-width: 280px;
                padding: 15px 0;
                margin-top: 5px;
            }
            
            .user-dropdown-menu .dropdown-header {
                padding: 15px 20px;
                border-bottom: 1px solid #dee2e6;
                background-color: #f8f9fa;
                margin-bottom: 10px;
            }
            
            .user-dropdown-menu .dropdown-item {
                padding: 10px 20px;
                transition: all 0.3s ease;
            }
            
            .user-dropdown-menu .dropdown-item:hover {
                background-color: #f8f9fa;
                padding-left: 25px;
            }
            
            .user-dropdown-menu .dropdown-item-text {
                padding: 8px 20px;
            }
            
            .navbar-toggler {
                padding: 8px;
                border-radius: 8px;
            }
            
            .navbar-toggler:focus {
                box-shadow: 0 0 0 0.2rem rgba(255,255,255,0.25);
            }
            
            /* Mobile adjustments */
            @media (max-width: 767.98px) {
                .brand-name {
                    font-size: 1.1rem;
                }
                
                .brand-subtitle {
                    display: none;
                }
                
                .logo-background {
                    width: 35px;
                    height: 35px;
                }
                
                .logo-icon {
                    font-size: 1.25rem;
                }
                
                .user-dropdown-menu {
                    min-width: 250px;
                }
            }
        </style>
    </div>
</body>
</html>
